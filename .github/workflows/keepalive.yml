# Penjaga tidur untuk tumpukan paket gratis (Keepalive & Ping Services).
#
# Tiga layanan, tiga perilaku tidur yang berbeda, dan ketiganya menyerang pada
# hari yang sama:
#
#   Supabase  menjeda proyek gratis setelah sekitar tujuh hari tanpa aktivitas.
#             Bila tidak ada yang menyentuh basis data antara penilaian
#             penyisihan dan final, proyeknya tertidur dan gateway gagal start —
#             bukan melambat, tetapi mati.
#   Render    mematikan layanan gratis setelah 15 menit menganggur. Permintaan
#             pertama sesudahnya butuh ±50 detik. Juri yang membuka dashboard
#             pertama kali akan menunggu hampir satu menit.
#
# `/api/health` memanggil `isSeeded()`, yang menyentuh Postgres — jadi satu
# permintaan ke gateway sekaligus menjaga Supabase terjaga dan Render hangat.
# `/health` layanan ML dijaga terpisah karena ia instans Render sendiri.
#
# Alur ini tidak menggantikan mode luring di `docker-compose.yml`. Ia mengurangi
# kemungkinan tumpukan daring tertidur; compose menghapus ketergantungan pada
# jaringan sama sekali. Rencana pameran memakai keduanya.
name: Ping & Keepalive (Backend Gateway & ML Service)

on:
  schedule:
    # Setiap 10 menit, di bawah ambang 15 menit Render. GitHub bisa menunda
    # jadwal saat antreannya panjang; penundaan berarti satu permintaan pertama
    # yang lambat, bukan demo yang mati.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      gateway_url:
        description: "URL Backend Gateway (opsional, kosongkan untuk memakai default/vars)"
        required: false
        default: ""
      ml_url:
        description: "URL Layanan ML (opsional, kosongkan untuk memakai default/vars)"
        required: false
        default: ""

# Alur terjadwal dinonaktifkan GitHub setelah 60 hari tanpa aktivitas di
# repositori. Untuk rentang menuju 26 September itu tidak relevan, tetapi ia
# alasan untuk tidak menganggap berkas ini abadi.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Services
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Gateway & ML Service
        env:
          # Mengutamakan input manual > vars GitHub > secrets GitHub > default URL Render
          GATEWAY_URL: ${{ inputs.gateway_url || vars.GATEWAY_URL || secrets.GATEWAY_URL || 'https://prakira-gateway.onrender.com' }}
          ML_URL: ${{ inputs.ml_url || vars.ML_SERVICE_URL || secrets.ML_SERVICE_URL || 'https://prakira-ml.onrender.com' }}
        run: |
          set -u

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### 📡 Hasil Ping Layanan (Keepalive)"
              echo ""
              echo "| Layanan | URL | HTTP Status | Durasi | Keterangan |"
              echo "|---|---|---|---|---|"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          status=0

          ping_service() {
            local name="$1"
            local base="$2"
            local path="$3"

            if [ -z "${base}" ]; then
              echo "::warning::[${name}] URL kosong, dilewati."
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "| **${name}** | - | - | - | ⚠️ Dilewati (URL kosong) |" >> "${GITHUB_STEP_SUMMARY}"
              fi
              return 0
            fi

            local url="${base%/}${path}"
            echo "📡 Memeriksa ${name}: ${url}"

            local out_file
            out_file=$(mktemp)
            local http_metrics=""

            # --max-time longgar (90s): instans Render yang baru bangun dari tidur butuh
            # ±50 detik untuk menjawab permintaan pertama.
            if http_metrics=$(curl --silent --show-error --fail --location \
              --retry 3 --retry-delay 15 --retry-all-errors \
              --max-time 90 --output "${out_file}" --write-out "%{http_code} %{time_total}" \
              "${url}"); then
              local http_code
              local time_total
              http_code=$(echo "${http_metrics}" | awk '{print $1}')
              time_total=$(echo "${http_metrics}" | awk '{print $2}')
              echo "  ✅ ${name} aktif (HTTP ${http_code}, durasi ${time_total}s)"
              if [ -s "${out_file}" ]; then
                head -c 160 "${out_file}"
                echo ""
              fi
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "| **${name}** | \`${url}\` | \`${http_code}\` | \`${time_total}s\` | ✅ Berhasil |" >> "${GITHUB_STEP_SUMMARY}"
              fi
            else
              echo "  ❌ ${name} gagal dijangkau"
              status=1
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "| **${name}** | \`${url}\` | Gagal | - | ❌ Gagal dijangkau |" >> "${GITHUB_STEP_SUMMARY}"
              fi
            fi
            rm -f "${out_file}"
          }

          ping_service "Backend Gateway" "${GATEWAY_URL}" "/api/health"
          ping_service "ML Service" "${ML_URL}" "/health"

          # Kegagalan sengaja dibiarkan non-zero (merah) agar tim mendapat notifikasi saat service mati.
          exit "${status}"
